# Análisis de seguridad CodeQL del backend (Python) y del frontend (JavaScript).
# Se ejecuta en cada pull request, en cada push a main y cada lunes, para
# detectar también vulnerabilidades que CodeQL aprenda después del último cambio.
# Las acciones están fijadas a un commit (con su versión en el comentario).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # lunes, 05:17 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analizar (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript cubre frontend/ y scripts/; no hace falta compilar nada.
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Código generado o de terceros: se analiza su fuente en frontend/, no la copia.
          config: |
            paths-ignore:
              - public
              - frontend/vendor
              - backend/templates
              - node_modules

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
